version: '3.8'

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rag_db
    ports:
      - "5435:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: